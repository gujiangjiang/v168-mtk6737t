name: Build TWRP (q5c62q_njx / MT6737T)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/share/swift || true
          df -h /

      - name: Add swap (防 OOM)
        run: |
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
              zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
              lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip ccache \
              libtinfo5 libncurses5
          # TWRP 9.0 构建脚本为 python2 (如 check_radio_versions.py);
          # 逐个安装容错, 并注意后面会给 ~/bin/python 建 python2 软链
          for p in python2 python2.7 python-is-python2; do
            sudo apt-get install -y $p || true
          done

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "ci@localhost"
          # jammy runner 的 /usr/local/bin/python 是 python3, 会抢先于
          # python-is-python2 的 /usr/bin/python; 因此在 ~/bin(最高优先级) 放 python2
          py2=/usr/bin/python2.7
          [ -x "$py2" ] || py2=/usr/bin/python2
          if [ -x "$py2" ]; then
            ln -sf "$py2" "$HOME/bin/python"
            "$HOME/bin/python" --version
          else
            echo "警告: 未找到 python2, TWRP 9.0 构建可能失败"
          fi

      - name: Sync TWRP minimal manifest (twrp-9.0)
        run: |
          mkdir -p $GITHUB_WORKSPACE/twrp
          cd $GITHUB_WORKSPACE/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          mkdir -p twrp/device/mediatek
          cp -r device/q5c62q_njx twrp/device/mediatek/q5c62q_njx

      - name: Patch known build issues
        run: |
          # TWRP 9.0 fb2png 的 -Wsign-compare 编译错误
          # (仅在本项目启用 TW_INCLUDE_FB2PNG 时触发, 上游修复见 TWRP 后续分支)
          f=twrp/bootable/recovery/fb2png/fb2png.c
          if [ -f "$f" ]; then
            sed -i 's|read(fd, x ,fb->size) != fb->size|read(fd, x ,fb->size) != (ssize_t)fb->size|' "$f"
            echo "--- fb2png.c sign-compare 修复结果:"
            grep -n "ssize_t)fb->size" "$f" || echo "警告: 未匹配到目标行(上游可能已修复)"
          fi

      - name: Build recovery
        run: |
          set +e
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo ">>> source build/envsetup.sh"
          source build/envsetup.sh
          echo ">>> envsetup rc=$?"
          echo ">>> lunch"
          # twrp-9.0 分支为 omni 命名; 若 manifest 变更为 twrp 命名则自动回退
          lunch omni_q5c62q_njx-eng || lunch twrp_q5c62q_njx-eng
          echo ">>> lunch rc=$?"
          mka recoveryimage -j$(nproc --all)
          rc=$?
          echo ">>> mka rc=$rc"
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-recovery-q5c62q_njx
          path: twrp/out/target/product/q5c62q_njx/recovery.img
          if-no-files-found: error
