name: Build TWRP (q5c62q_njx / MT6737T)

on:
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: "TWRP minimal manifest 分支: twrp-8.1=体积友好(推荐默认) / twrp-9.0=现代分支(裁剪后仍 ~18.7MB, 需进一步瘦身) / twrp-7.1=最小"
        required: true
        default: "twrp-8.1"
        type: choice
        options:
          - twrp-8.1
          - twrp-9.0
          - twrp-7.1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v5

      - name: Set up JDK 8
        # Android 7.1/8.1/9 构建系统要求 JDK 8 (runner 默认 JDK 11 会直接报错退出)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/share/swift || true
          df -h /

      - name: Add swap (防 OOM)
        run: |
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
              zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
              lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip ccache \
              libtinfo5 libncurses5 schedtool
          # TWRP 7.1/8.1/9.0 构建脚本为 python2 (如 check_radio_versions.py);
          # 逐个安装容错, 并注意后面会给 ~/bin/python 建 python2 软链
          for p in python2 python2.7 python-is-python2; do
            sudo apt-get install -y $p || true
          done

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "ci@localhost"
          # jammy runner 的 /usr/local/bin/python 是 python3, 会抢先于
          # python-is-python2 的 /usr/bin/python; 因此在 ~/bin(最高优先级) 放 python2
          py2=/usr/bin/python2.7
          [ -x "$py2" ] || py2=/usr/bin/python2
          if [ -x "$py2" ]; then
            ln -sf "$py2" "$HOME/bin/python"
            "$HOME/bin/python" --version
          else
            echo "警告: 未找到 python2, TWRP 9.0 构建可能失败"
          fi

      - name: Sync TWRP minimal manifest (${{ inputs.twrp_branch }})
        run: |
          TWRP_BRANCH="${{ inputs.twrp_branch }}"
          [ -n "$TWRP_BRANCH" ] || TWRP_BRANCH=twrp-8.1
          echo ">>> 使用分支: $TWRP_BRANCH"
          mkdir -p $GITHUB_WORKSPACE/twrp
          cd $GITHUB_WORKSPACE/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b "$TWRP_BRANCH"
          ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          mkdir -p twrp/device/mediatek
          cp -r device/q5c62q_njx twrp/device/mediatek/q5c62q_njx

      - name: Patch known build issues
        run: |
          # TWRP 9.0 fb2png 的 -Wsign-compare 编译错误
          # (仅在本项目启用 TW_INCLUDE_FB2PNG 时触发, 上游修复见 TWRP 后续分支)
          f=twrp/bootable/recovery/fb2png/fb2png.c
          if [ -f "$f" ]; then
            sed -i 's|read(fd, x ,fb->size) != fb->size|read(fd, x ,fb->size) != (ssize_t)fb->size|' "$f"
            echo "--- fb2png.c sign-compare 修复结果:"
            grep -n "ssize_t)fb->size" "$f" || echo "警告: 未匹配到目标行(上游可能已修复)"
          fi

      - name: Build recovery
        run: |
          set +e
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo ">>> source build/envsetup.sh"
          source build/envsetup.sh
          echo ">>> envsetup rc=$?"
          echo ">>> lunch"
          # twrp-9.0 分支为 omni 命名; 若 manifest 变更为 twrp 命名则自动回退
          lunch omni_q5c62q_njx-eng || lunch twrp_q5c62q_njx-eng
          echo ">>> lunch rc=$?"
          mka recoveryimage -j$(nproc --all) 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo ">>> mka rc=$rc"
          exit $rc

      - name: Salvage oversize image (strip + repack)
        if: always()
        run: |
          set +e
          OUT=twrp/out/target/product/q5c62q_njx
          ROOT=$OUT/recovery/root
          IMG=$OUT/recovery.img
          LIMIT=16777216
          SIZE=$(stat -c %s "$IMG" 2>/dev/null || echo 0)
          if [ "$SIZE" -le "$LIMIT" ]; then
            echo ">>> 镜像未超限 (size=$SIZE), 无需瘦身"
            exit 0
          fi
          HOST=twrp/out/host/linux-x86/bin
          CSTRIP=twrp/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-strip
          [ -x "$CSTRIP" ] || CSTRIP=strip
          echo ">>> 原镜像 $SIZE 字节, 开始 strip 瘦身 ($CSTRIP)"
          N=0
          for f in $(find "$ROOT" -type f); do
            if file -b "$f" 2>/dev/null | grep -q "ELF"; then
              if "$CSTRIP" "$f" 2>/dev/null; then N=$((N+1)); fi
            fi
          done
          echo ">>> 已 strip $N 个 ELF 文件"
          # 附加裁剪: 离线充电动画二进制(约1MB, TWRP 正常使用不需要; 充电由硬件/内核完成)
          if [ -f "$ROOT/sbin/charger" ]; then
            rm -f "$ROOT/sbin/charger" && echo ">>> 已移除 sbin/charger (~1MB)"
          fi
          "$HOST/mkbootfs" -d "$OUT/system" "$ROOT" | "$HOST/minigzip" > /tmp/ramdisk-salvage.gz || exit 0
          python3 tools/mkbootimg_mtk.py \
            --kernel "$OUT/kernel" \
            --ramdisk /tmp/ramdisk-salvage.gz \
            --out "$OUT/recovery-salvage.img" \
            --cmdline "bootopt=64S3,32N2,32N2 androidboot.selinux=permissive buildvariant=eng" \
            --name 1505127327
          S2=$(stat -c %s "$OUT/recovery-salvage.img" 2>/dev/null || echo 0)
          echo ">>> 瘦身后: $S2 字节 (原 $SIZE, 上限 $LIMIT)"
          if [ "$S2" -gt 0 ] && [ "$S2" -le "$LIMIT" ]; then
            echo ">>> ✅ 瘦身成功, 见 Summary 与 TWRP-recovery-salvage-q5c62q_njx"
          else
            echo ">>> ❌ 瘦身后仍超限, 见 Summary 体积明细"
          fi

      - name: Summary (always)
        if: always()
        run: |
          set +e
          OUT=twrp/out/target/product/q5c62q_njx
          IMG=$OUT/recovery.img
          SAL=$OUT/recovery-salvage.img
          LIMIT=16777216
          SIZE=0
          [ -f "$IMG" ] && SIZE=$(stat -c %s "$IMG")
          SSIZE=0
          [ -f "$SAL" ] && SSIZE=$(stat -c %s "$SAL")

          volume_breakdown() {
            ROOT=$OUT/recovery/root
            echo "### recovery root 体积明细"
            echo
            echo '```'
            echo "解压总体积: $(du -sh $ROOT 2>/dev/null | cut -f1), 文件数: $(find $ROOT -type f 2>/dev/null | wc -l)"
            ls -l $OUT/ramdisk-recovery.img 2>/dev/null || true
            echo "-- 目录 TOP15 --"
            du -sk $ROOT/* 2>/dev/null | sort -rn | head -15
            echo "-- 大目录细分 (sbin / etc / twres) --"
            du -sk $ROOT/sbin/* 2>/dev/null | sort -rn | head -10
            du -sk $ROOT/etc/* 2>/dev/null | sort -rn | head -10
            du -sk $ROOT/twres/* 2>/dev/null | sort -rn | head -8
            echo "-- 单文件 TOP40 (>200KB) --"
            find $ROOT -type f -size +200k -exec du -k {} + 2>/dev/null | sort -rn | head -40
            echo '```'
          }

          {
            echo "# TWRP 编译结果 (q5c62q_njx / MT6737T)"
            echo
            if [ "$SIZE" -gt 0 ] && [ "$SIZE" -le "$LIMIT" ]; then
              HASH=$(sha256sum "$IMG" | cut -d' ' -f1)
              echo "## ✅ 编译成功"
              echo
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| 镜像 | \`recovery.img\` |"
              echo "| 大小 | ${SIZE} 字节 (约 $((SIZE/1048576)) MB) |"
              echo "| 分区余量 | $((LIMIT - SIZE)) 字节 (上限 ${LIMIT}) |"
              echo "| SHA256 | \`${HASH}\` |"
              echo "| 下载 | 本页底部 Artifacts → \`TWRP-recovery-q5c62q_njx\` |"
              echo
              echo "### 镜像头部校验"
              echo
              echo '```'
              python3 tools/unpack_bootimg.py --info "$IMG" 2>/dev/null || echo "(解析失败)"
              echo '```'
            elif [ "$SSIZE" -gt 0 ] && [ "$SSIZE" -le "$LIMIT" ]; then
              echo "## ✅ 编译成功（经自动瘦身）"
              echo
              echo "原始镜像超限，已自动 strip + 重打包为 \`recovery-salvage.img\`："
              echo
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| 原镜像 | ${SIZE} 字节 (超出 $((SIZE - LIMIT))) |"
              echo "| 瘦身后 | ${SSIZE} 字节 (约 $((SSIZE/1048576)) MB), 余量 $((LIMIT - SSIZE)) |"
              echo "| SHA256 | \`$(sha256sum "$SAL" | cut -d' ' -f1)\` |"
              echo "| 下载 | 本页底部 Artifacts → \`TWRP-recovery-salvage-q5c62q_njx\`（文件名 recovery-salvage.img） |"
              echo
              echo "### 瘦身后镜像头部校验"
              echo
              echo '```'
              python3 tools/unpack_bootimg.py --info "$SAL" 2>/dev/null || echo "(解析失败)"
              echo '```'
            elif [ "$SIZE" -gt "$LIMIT" ]; then
              echo "## ⚠️ 构建完成, 但镜像超过 16MB 分区（自动瘦身也未能压入）"
              echo
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| 大小 | ${SIZE} 字节 (约 $((SIZE/1048576)) MB) |"
              echo "| 超出分区 | $((SIZE - LIMIT)) 字节 (上限 ${LIMIT}) |"
              echo
              volume_breakdown
              echo
              echo "> 处理: 在 BoardConfig.mk 增加裁剪开关, 或换用体积更小的分支（本工作流输入 \`twrp_branch\`，如默认的 twrp-8.1）"
            else
              echo "## ❌ 编译失败"
              echo
              echo "未产出 recovery.img。错误摘要（完整日志见上方 Build recovery 步骤）："
              echo
              echo '```'
              grep -n -B2 -A25 "FAILED\|ninja: build stopped\|error:" twrp/build.log 2>/dev/null | tail -80 || echo "(未捕获到 build.log)"
              echo '```'
              echo
              volume_breakdown
              echo
              for f in $OUT/*.img; do
                [ -f "$f" ] && echo "- 已生成: \`$f\` = $(stat -c %s "$f") 字节"
              done
            fi
            echo
            echo "> 完整日志见本页 Job 的 Build recovery 步骤；产物在 Artifacts 区域。"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-recovery-q5c62q_njx
          path: twrp/out/target/product/q5c62q_njx/recovery.img
          if-no-files-found: error

      - name: Upload salvage artifact (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-recovery-salvage-q5c62q_njx
          path: twrp/out/target/product/q5c62q_njx/recovery-salvage.img
          if-no-files-found: ignore
