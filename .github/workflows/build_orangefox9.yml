name: Build OrangeFox fox_9.0 (q5c62q_njx / MT6737T)

# OrangeFox fox_9.0 (= TWRP 9.0 底座 + 橙狐 R10 界面/工具):
#   本机内核只支持 gzip initramfs (lib/decompress.c 表中 lzma/xz/bzip2 指针全为 NULL),
#   A12 版 fox_12.1 核心体积远超 16MB 不可行, 故选与 TWRP 9.0 同底的 fox_9.0。
#   官方流程: twrp-9.0 minimal omni manifest + patch-manifest-fox_9.0.diff
#             + OrangeFox bootable/Recovery(fox_9.0) + vendor/recovery(legacy) + external/busybox

on:
  workflow_dispatch:
    inputs:
      fox_extreme:
        description: "极限瘦身 FOX_EXTREME_SIZE_REDUCTION=1 (删非默认字体/附加工具, 默认 off; 仅在超限时开启)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v5

      - name: Set up JDK 8
        # Android 9 构建系统要求 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/share/swift || true
          df -h /

      - name: Add swap (防 OOM)
        run: |
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
              zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
              lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip ccache \
              libtinfo5 libncurses5 schedtool
          # TWRP/OrangeFox 9.0 构建脚本为 python2
          for p in python2 python2.7 python-is-python2; do
            sudo apt-get install -y $p || true
          done

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "ci@localhost"
          # runner 的 /usr/local/bin/python 是 python3, 用 ~/bin/python(最高优先级) 指向 python2
          py2=/usr/bin/python2.7
          [ -x "$py2" ] || py2=/usr/bin/python2
          if [ -x "$py2" ]; then
            ln -sf "$py2" "$HOME/bin/python"
            "$HOME/bin/python" --version
          else
            echo "警告: 未找到 python2, 构建可能失败"
          fi

      - name: Sync TWRP 9.0 minimal manifest (omni)
        run: |
          mkdir -p fox9
          cd fox9
          # 与 TWRP 9.0 工作流同源 (platform_manifest_twrp_omni twrp-9.0), 已实测可构建
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Install OrangeFox sources (fox_9.0 官方换装步骤)
        run: |
          set -e
          # 1) 官方 manifest 补丁 (builder 钩子: vendor/recovery/OrangeFox.sh 集成到 build/core)
          mkdir -p ~/ofox_sync
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git ~/ofox_sync/sync
          cd fox9/build
          patch -p1 < ~/ofox_sync/sync/legacy/patches/patch-manifest-fox_9.0.diff
          grep -n "Fox_Before_Recovery_Image" core/Makefile >/dev/null && echo ">>> manifest 补丁已生效"
          cd "$GITHUB_WORKSPACE"

          # 2) bootable/recovery 换为 OrangeFox fox_9.0 (含主题 submodule)
          rm -rf fox9/bootable/recovery
          git clone --depth=1 -b fox_9.0 https://gitlab.com/OrangeFox/bootable/Recovery.git fox9/bootable/recovery
          cd fox9/bootable/recovery
          # submodule 写的是 git@gitlab.com (CI 无 SSH key), 用 insteadOf 强制走 https
          git -c url.https://gitlab.com/OrangeFox/misc/theme.git.insteadOf=git@gitlab.com:OrangeFox/misc/theme.git \
              submodule update --init --depth=1 || true
          if [ ! -f gui/theme/portrait_hdpi/ui.xml ]; then
            echo ">>> submodule 失败, 兜底按 SHA 拉取主题 (fox_9.0 对应提交)"
            rm -rf gui/theme
            git clone https://gitlab.com/OrangeFox/misc/theme.git gui/theme
            (cd gui/theme && git fetch --depth=1 origin 51b06e501e32fa69df28a507b0a64382be6d2db4 && git checkout FETCH_HEAD)
          fi
          test -f gui/theme/portrait_hdpi/ui.xml && echo ">>> 主题就绪"
          cd "$GITHUB_WORKSPACE"

          # 3) vendor/recovery legacy 分支 (fox_9.0 使用 old master=legacy)
          rm -rf fox9/vendor/recovery
          git clone --depth=1 -b legacy https://gitlab.com/OrangeFox/vendor/recovery.git fox9/vendor/recovery
          test -f fox9/vendor/recovery/OrangeFox.sh && echo ">>> vendor/recovery(legacy) 就绪"

          # 4) external/busybox (OrangeFox 版, android-9.0)
          rm -rf fox9/external/busybox
          git clone --depth=1 -b android-9.0 https://gitlab.com/OrangeFox/external/busybox.git fox9/external/busybox
          test -d fox9/external/busybox && echo ">>> external/busybox 就绪"

          # 5) qcom common (manifest 缺省时补齐, 不影响 mediatek 设备)
          [ -d fox9/device/qcom/common ] || \
            git clone --depth=1 -b android-9.0 https://github.com/TeamWin/android_device_qcom_common fox9/device/qcom/common
          [ -d fox9/device/qcom/twrp-common ] || \
            git clone --depth=1 -b android-9.0 https://github.com/TeamWin/android_device_qcom_twrp-common fox9/device/qcom/twrp-common

      - name: Copy device tree
        run: |
          mkdir -p fox9/device/mediatek
          cp -r device/q5c62q_njx fox9/device/mediatek/q5c62q_njx
          echo ">>> device tree 已就位 (BoardConfig 按 PLATFORM_SDK_VERSION 自动走 A9 分支: TW_EXCLUDE_ENCRYPTED_BACKUPS=true, TW_USE_TOOLBOX=true)"

      - name: Build recovery
        run: |
          set +e
          cd fox9
          export FOX_BUILD_TYPE=Unofficial
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          if [ "${{ inputs.fox_extreme }}" = "true" ]; then
            export FOX_EXTREME_SIZE_REDUCTION=1
            echo ">>> fox_extreme=true: 已启用 FOX_EXTREME_SIZE_REDUCTION"
          fi
          echo ">>> source build/envsetup.sh"
          source build/envsetup.sh
          echo ">>> envsetup rc=$?"
          echo ">>> lunch"
          lunch omni_q5c62q_njx-eng
          echo ">>> lunch rc=$?"
          mka recoveryimage -j$(nproc --all) 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo ">>> mka rc=$rc"
          ls -la out/target/product/q5c62q_njx/*.img 2>/dev/null
          exit $rc

      - name: Salvage oversize image (strip + repack)
        if: always()
        run: |
          set +e
          OUT=fox9/out/target/product/q5c62q_njx
          ROOT=$OUT/recovery/root
          IMG=$OUT/recovery.img
          LIMIT=16777216
          SIZE=$(stat -c %s "$IMG" 2>/dev/null || echo 0)
          if [ "$SIZE" -le "$LIMIT" ] || [ "$SIZE" -eq 0 ]; then
            echo ">>> 无需瘦身 (size=$SIZE)"
            exit 0
          fi
          HOST=fox9/out/host/linux-x86/bin
          CSTRIP=fox9/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-strip
          [ -x "$CSTRIP" ] || CSTRIP=strip
          echo ">>> 原镜像 $SIZE 字节, 开始 strip 瘦身 ($CSTRIP)"
          N=0
          for f in $(find "$ROOT" -type f); do
            if file -b "$f" 2>/dev/null | grep -q "ELF"; then
              if "$CSTRIP" "$f" 2>/dev/null; then N=$((N+1)); fi
            fi
          done
          echo ">>> 已 strip $N 个 ELF 文件"
          "$HOST/mkbootfs" -d "$OUT/system" "$ROOT" | "$HOST/minigzip" > /tmp/ramdisk-salvage.gz || exit 0
          python3 tools/mkbootimg_mtk.py \
            --kernel "$OUT/kernel" \
            --ramdisk /tmp/ramdisk-salvage.gz \
            --out "$OUT/recovery-salvage.img" \
            --cmdline "bootopt=64S3,32N2,32N2 androidboot.selinux=permissive buildvariant=eng" \
            --name 1505127327
          S2=$(stat -c %s "$OUT/recovery-salvage.img" 2>/dev/null || echo 0)
          echo ">>> 瘦身后: $S2 字节 (原 $SIZE, 上限 $LIMIT)"
          if [ "$S2" -gt 0 ] && [ "$S2" -le "$LIMIT" ]; then
            echo ">>> ✅ 瘦身成功"
          else
            echo ">>> ❌ 瘦身后仍超限, 建议下次运行勾选 fox_extreme=true"
          fi

      - name: Summary (always)
        if: always()
        run: |
          set +e
          OUT=fox9/out/target/product/q5c62q_njx
          ROOT=$OUT/recovery/root
          IMG=$OUT/recovery.img
          SAL=$OUT/recovery-salvage.img
          LIMIT=16777216
          SIZE=0
          [ -f "$IMG" ] && SIZE=$(stat -c %s "$IMG")
          SSIZE=0
          [ -f "$SAL" ] && SSIZE=$(stat -c %s "$SAL")

          # ---- 构建详情检测 ----
          FOX_VER=$(strings -a "$ROOT/sbin/recovery" 2>/dev/null | grep -m1 -iE "OrangeFox|fox_9" || true)
          [ -n "$FOX_VER" ] || FOX_VER="(未识别)"
          if [ -e "$ROOT/twres/fonts/Chococooky.ttf" ]; then FONTS_STATE="完整字体集"; else FONTS_STATE="已裁剪(无 Chococooky)"; fi
          if [ -e "$ROOT/sbin/zip" ]; then ZIP_STATE="包含"; else ZIP_STATE="未包含"; fi
          if [ -e "$ROOT/sbin/busybox" ]; then BB_STATE="包含"; else BB_STATE="未包含"; fi

          volume_breakdown() {
            echo "### recovery root 体积明细"
            echo
            echo '```'
            echo "du 总体积: $(du -sh $ROOT 2>/dev/null | cut -f1), 文件数: $(find $ROOT -type f 2>/dev/null | wc -l)"
            python3 -c "import os,sys;r=sys.argv[1];t=sum(os.path.getsize(os.path.join(dp,f)) for dp,_,fs in os.walk(r) for f in fs if not os.path.islink(os.path.join(dp,f)));print('实际字节:',t,f'({t/1048576:.2f}MB)')" "$ROOT" 2>/dev/null
            ls -l $OUT/ramdisk-recovery.img 2>/dev/null && file $OUT/ramdisk-recovery.img 2>/dev/null
            echo "-- 目录 TOP15 --"
            du -sk $ROOT/* 2>/dev/null | sort -rn | head -15
            echo "-- 单文件 TOP40 (>100KB) --"
            find $ROOT -type f -size +100k -exec du -k {} + 2>/dev/null | sort -rn | head -40
            echo "-- ELF 依赖分析 (关键库引用者) --"
            : > /tmp/fox_deps.txt
            for d in "$ROOT/sbin" "$ROOT/system/bin" "$ROOT/system/lib"; do
              [ -d "$d" ] || continue
              for f in "$d"/*; do
                [ -f "$f" ] || continue
                [ -L "$f" ] && continue
                deps=$(readelf -d "$f" 2>/dev/null | sed -n 's/.*(NEEDED).*\[\(.*\)\].*/\1/p')
                [ -n "$deps" ] || continue
                for dep in $deps; do echo "$dep <- $(basename "$f")"; done
              done
            done > /tmp/fox_deps.txt
            grep -E "^(libchrome|libandroidicu|libicu|libclang_rt|libunwindstack|libevent\.so|libpcre)" /tmp/fox_deps.txt || echo "  (无额外重库)"
            echo "-- 未被引用的 .so 候选 (非全量可信, >50KB) --"
            awk '{print $1}' /tmp/fox_deps.txt | sort -u > /tmp/fox_ref.txt
            for d in "$ROOT/sbin" "$ROOT/system/lib"; do
              [ -d "$d" ] || continue
              for f in "$d"/*.so; do
                [ -f "$f" ] || continue
                b=$(basename "$f")
                grep -qx "$b" /tmp/fox_ref.txt && continue
                case "$b" in libc.so|libdl.so|libm.so) continue;; esac
                sz=$(stat -c %s "$f")
                [ "$sz" -gt 51200 ] && echo "$((sz/1024))K  $b"
              done
            done | sort -rn | head -20
            echo '```'
          }

          {
            echo "# OrangeFox fox_9.0 编译结果 (q5c62q_njx / MT6737T)"
            echo
            if [ "$SIZE" -gt 0 ] && [ "$SIZE" -le "$LIMIT" ]; then
              HASH=$(sha256sum "$IMG" | cut -d' ' -f1)
              echo "## ✅ 编译成功"
              echo
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| 版本标识 | ${FOX_VER} |"
              echo "| 额外裁剪 | fox_extreme=\`${{ inputs.fox_extreme }}\` |"
              echo "| 字体 | ${FONTS_STATE} |"
              echo "| busybox / zip | ${BB_STATE} / ${ZIP_STATE} |"
              echo "| 镜像 | \`recovery.img\` |"
              echo "| 大小 | ${SIZE} 字节 (约 $((SIZE/1048576)) MB) |"
              echo "| 分区余量 | $((LIMIT - SIZE)) 字节 (上限 ${LIMIT}) |"
              echo "| SHA256 | \`${HASH}\` |"
              echo "| 下载 | 本页底部 Artifacts → \`OrangeFox9-recovery-q5c62q_njx\` |"
              echo
              echo "> ramdisk 为 gzip (本机内核仅支持 gzip initramfs, 不可用 lzma)"
              echo
              echo "### 镜像头部校验"
              echo
              echo '```'
              python3 tools/unpack_bootimg.py --info "$IMG" 2>/dev/null || echo "(解析失败)"
              echo '```'
            elif [ "$SSIZE" -gt 0 ] && [ "$SSIZE" -le "$LIMIT" ]; then
              echo "## ✅ 编译成功（经自动瘦身）"
              echo
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| 原镜像 | ${SIZE} 字节 (超出 $((SIZE - LIMIT))) |"
              echo "| 瘦身后 | ${SSIZE} 字节 (约 $((SSIZE/1048576)) MB), 余量 $((LIMIT - SSIZE)) |"
              echo "| SHA256 | \`$(sha256sum "$SAL" | cut -d' ' -f1)\` |"
              echo "| 下载 | Artifacts → \`OrangeFox9-recovery-q5c62q_njx\`（recovery-salvage.img） |"
              echo
              echo "### 瘦身后镜像头部校验"
              echo
              echo '```'
              python3 tools/unpack_bootimg.py --info "$SAL" 2>/dev/null || echo "(解析失败)"
              echo '```'
            elif [ "$SIZE" -gt "$LIMIT" ]; then
              echo "## ⚠️ 构建完成, 但镜像超过 16MB 分区"
              echo
              echo "| 镜像 | 大小 | 超出 |"
              echo "|---|---|---|"
              echo "| \`recovery.img\` | ${SIZE} 字节 | $((SIZE - LIMIT)) 字节 |"
              echo
              volume_breakdown
              echo
              echo "> 处理: 重跑并勾选 \`fox_extreme=true\` (FOX_EXTREME_SIZE_REDUCTION, 删除非默认字体/附加工具)"
            else
              echo "## ❌ 编译失败"
              echo
              echo "错误摘要（完整日志见上方 Build recovery 步骤）："
              echo
              echo '```'
              grep -n -B2 -A30 "FAILED\|ninja: build stopped\|error:\|Error " fox9/build.log 2>/dev/null | tail -80 || echo "(未捕获到 build.log)"
              echo '```'
              echo
              volume_breakdown
              echo
              for f in $OUT/*.img; do
                [ -f "$f" ] && echo "- 已生成: \`$f\` = $(stat -c %s "$f") 字节"
              done
            fi
            echo
            echo "> 完整日志见本页 Job 的 Build recovery 步骤；产物在 Artifacts 区域。"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rename output
        if: always()
        run: |
          set +e
          OUT=fox9/out/target/product/q5c62q_njx
          for f in $OUT/OrangeFox-*.img; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            case "$n" in
              *q5c62q*) new="${n/q5c62q/q5c62q_njx}" ;;
              *) new="${n%.img}-q5c62q_njx.img" ;;
            esac
            cp -f "$f" "$OUT/$new" 2>/dev/null && echo ">>> $n -> $new"
          done
          ls -la $OUT/*.img 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox9-recovery-q5c62q_njx
          path: |
            fox9/out/target/product/q5c62q_njx/OrangeFox-*.img
            fox9/out/target/product/q5c62q_njx/recovery.img
            fox9/out/target/product/q5c62q_njx/recovery-salvage.img
          if-no-files-found: warn
