name: Build OrangeFox (q5c62q_njx / MT6737T)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/share/swift || true
          df -h /

      - name: Add swap (防 OOM)
        run: |
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
              zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
              lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip ccache rsync \
              libtinfo5 libncurses5

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          repo --version
          git config --global user.name "github-actions"
          git config --global user.email "ci@localhost"

      - name: Sync OrangeFox sources (fox_12.1)
        run: |
          mkdir -p ~/OrangeFox_sync && cd ~/OrangeFox_sync
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      - name: Copy device tree
        run: |
          mkdir -p ~/fox_12.1/device/mediatek
          cp -r device/q5c62q_njx ~/fox_12.1/device/mediatek/q5c62q_njx

      - name: Build recovery
        run: |
          set +e
          cd ~/fox_12.1
          export FOX_BUILD_DEVICE=q5c62q_njx
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo ">>> source build/envsetup.sh"
          source build/envsetup.sh
          echo ">>> envsetup rc=$?"
          echo ">>> lunch"
          # fox_12.1 树没有 vendor/omni, 只能使用 twrp_ 命名目标
          lunch twrp_q5c62q_njx-eng
          echo ">>> lunch rc=$?"
          mka recoveryimage -j$(nproc --all) 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo ">>> mka rc=$rc"
          ls -la out/target/product/q5c62q_njx/ 2>/dev/null
          for f in out/target/product/q5c62q_njx/*.img; do
            [ -f "$f" ] || continue
            s=$(stat -c %s "$f")
            echo "IMAGE $f = $s bytes"
            [ "$s" -gt 16777216 ] && echo "警告: $f 超过 16MB recovery 分区, 刷入前必须裁剪!"
          done
          exit $rc

      - name: Summary (always)
        if: always()
        run: |
          set +e
          OUT=$HOME/fox_12.1/out/target/product/q5c62q_njx
          LOG=$HOME/fox_12.1/build.log
          OFOX_IMG=$(ls $OUT/OrangeFox-*.img 2>/dev/null | head -1)
          REC_IMG=""
          [ -f "$OUT/recovery.img" ] && REC_IMG=$OUT/recovery.img
          {
            echo "# OrangeFox (fox_12.1) 编译结果 (q5c62q_njx / MT6737T)"
            echo
            if [ -n "$OFOX_IMG" ] || [ -n "$REC_IMG" ]; then
              echo "## ✅ 编译成功"
              echo
              echo "| 镜像 | 大小 | SHA256 |"
              echo "|---|---|---|"
              for f in $OFOX_IMG $REC_IMG; do
                [ -f "$f" ] || continue
                S=$(stat -c %s "$f")
                echo "| \`$(basename "$f")\` | ${S} 字节 (约 $((S/1048576)) MB) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
                if [ "$S" -gt 16777216 ]; then
                  echo "| ⚠️ 超限警告 | 超过 16MB recovery 分区, 刷入前必须裁剪 | - |"
                fi
              done
              echo
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| 下载 | Artifacts → \`OrangeFox-recovery-q5c62q_njx\` |"
              if [ -n "$REC_IMG" ]; then
                echo
                echo "### recovery.img 头部校验"
                echo
                echo '```'
                python3 tools/unpack_bootimg.py --info "$REC_IMG" 2>/dev/null || echo "(解析失败)"
                echo '```'
              fi
            else
              echo "## ❌ 编译失败"
              echo
              echo "错误摘要（完整日志见上方 Build recovery 步骤）："
              echo
              echo '```'
              grep -n -B2 -A30 "FAILED\|ninja: build stopped\|error:" "$LOG" 2>/dev/null | tail -80 || echo "(未捕获到 build.log)"
              echo '```'
              echo
              echo "### 体积明细（定位超限大头）"
              echo
              echo '```'
              echo "== recovery/root =="
              echo "解压总体积: $(du -sh $OUT/recovery/root 2>/dev/null | cut -f1), 文件数: $(find $OUT/recovery/root -type f 2>/dev/null | wc -l)"
              echo "-- 单文件 TOP40 (>200KB) --"
              find $OUT/recovery/root -type f -size +200k -exec du -k {} + 2>/dev/null | sort -rn | head -40
              echo "== system =="
              echo "解压总体积: $(du -sh $OUT/system 2>/dev/null | cut -f1)"
              echo "-- 单文件 TOP20 (>500KB) --"
              find $OUT/system -type f -size +500k -exec du -k {} + 2>/dev/null | sort -rn | head -20
              echo '```'
              echo
              for f in $OUT/*.img; do
                [ -f "$f" ] && echo "- 已生成: \`$f\` = $(stat -c %s "$f") 字节"
              done
            fi
            echo
            echo "> 完整日志见本页 Job 的 Build recovery 步骤；产物在 Artifacts 区域。"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-recovery-q5c62q_njx
          path: |
            ~/fox_12.1/out/target/product/q5c62q_njx/OrangeFox-*.img
            ~/fox_12.1/out/target/product/q5c62q_njx/recovery.img
          if-no-files-found: warn
