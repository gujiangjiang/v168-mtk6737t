name: Build OrangeFox (q5c62q_njx / MT6737T)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/share/swift || true
          df -h /

      - name: Add swap (防 OOM)
        run: |
          sudo fallocate -l 6G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=6144
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
              zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
              lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip ccache rsync \
              libtinfo5 libncurses5

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          repo --version
          git config --global user.name "github-actions"
          git config --global user.email "ci@localhost"

      - name: Sync OrangeFox sources (fox_12.1)
        run: |
          mkdir -p ~/OrangeFox_sync && cd ~/OrangeFox_sync
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      - name: Copy device tree
        run: |
          mkdir -p ~/fox_12.1/device/mediatek
          cp -r device/q5c62q_njx ~/fox_12.1/device/mediatek/q5c62q_njx

      - name: Build recovery
        run: |
          set +e
          cd ~/fox_12.1
          export FOX_BUILD_DEVICE=q5c62q_njx
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo ">>> source build/envsetup.sh"
          source build/envsetup.sh
          echo ">>> envsetup rc=$?"
          echo ">>> lunch"
          # fox_12.1 树没有 vendor/omni, 只能使用 twrp_ 命名目标
          lunch twrp_q5c62q_njx-eng
          echo ">>> lunch rc=$?"
          mka recoveryimage -j$(nproc --all)
          rc=$?
          echo ">>> mka rc=$rc"
          ls -la out/target/product/q5c62q_njx/ 2>/dev/null
          for f in out/target/product/q5c62q_njx/*.img; do
            [ -f "$f" ] || continue
            s=$(stat -c %s "$f")
            echo "IMAGE $f = $s bytes"
            [ "$s" -gt 16777216 ] && echo "警告: $f 超过 16MB recovery 分区, 刷入前必须裁剪!"
          done
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-recovery-q5c62q_njx
          path: |
            ~/fox_12.1/out/target/product/q5c62q_njx/OrangeFox-*.img
            ~/fox_12.1/out/target/product/q5c62q_njx/recovery.img
          if-no-files-found: warn
